async function rest(path) {

      const r = await fetch(base + path);

}

// Rumus baku row size: rata-rata range 200 candle terakhir / 10,

function niceNum(x) {
  if (!(x > 0) || !isFinite(x)) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(x)));
  const m = x / p;
  return (m < 1.5 ? 1 : m < 3.5 ? 2.5 : m < 7.5 ? 5 : 10) * p;
}
function autoBucket() {
  const N = Math.min(200, DATA.length);
  if (N < 20) return BUCKETS[SYM][TF];
  let sum = 0;
  for (let i = DATA.length - N; i < DATA.length; i++) sum += DATA[i].high - DATA[i].low;
  return Math.max(niceNum(sum / N / 10), BUCKETS[SYM][TF]);
}
function rebinLevels(levels, toB) {
  const map = new Map();
  for (const lv of levels) {
    const np = Math.round(lv[0] / toB) * toB;
    const k = np.toFixed(8);
    let row = map.get(k);
    if (!row) { row = [np, 0, 0]; map.set(k, row); }
    row[1] += lv[1]; row[2] += lv[2];
  }
  return [...map.values()].sort((a, b) => a[0] - b[0]);
}
function finalizeCandle(c) {
  let d = 0, tv = 0, mx = 0;
  for (const lv of c.levels) {
    const t = lv[1] + lv[2];
    d += lv[1] - lv[2]; tv += t;
    if (t > mx) mx = t;
  }
  c._delta = d; c._vol = tv; c._maxVol = mx;
  setPOC(c);
}
// POC = VWAP di dalam zona terpadat (sliding window).
// Return {price, bias}: bias = (buy-sell)/(buy+sell) di window -> arah tembok.
// (Contoh: bawah total 500 padat vs atas total 300 tersebar -> menang yang bawah.)
function setPOC(c) {
  const r = computePOC(c.levels);
  c._poc = r ? r.price : null;
  c._pocBias = r ? r.bias : 0;
}
function computePOC(levels) {
  if (!levels || !levels.length) return null;
  const sorted = [...levels].sort((a, b) => a[0] - b[0]);
  const bkt = (typeof BUCKET === "number" && BUCKET > 0 ? BUCKET : 1);
  const winPx = bkt * 4; // window 4 bucket
  let bestVol = -1, bestStart = 0;
  for (let i = 0; i < sorted.length; i++) {
    const p0 = sorted[i][0];
    let v = 0;
    for (let j = i; j < sorted.length && sorted[j][0] - p0 <= winPx; j++) {
      v += sorted[j][1] + sorted[j][2];
    }
    if (v > bestVol) { bestVol = v; bestStart = i; }
  }
  const p0 = sorted[bestStart][0];
  let pxv = 0, tv = 0, tb = 0, ts = 0;
  for (let j = bestStart; j < sorted.length && sorted[j][0] - p0 <= winPx; j++) {
    const lv = sorted[j], t = lv[1] + lv[2];
    pxv += lv[0] * t; tv += t; tb += lv[1]; ts += lv[2];
  }
  if (tv <= 0) return null;
  return { price: pxv / tv, bias: (tb - ts) / tv }; // bias: +1 full buy, -1 full sell
}

function bucketOf(p) { return Math.round(p / BUCKET) * BUCKET; }

function newCandle(t, p) {
  return { time: t, open: p, high: p, low: p, close: p, levels: [],
           _delta: 0, _vol: 0, _poc: null, _pocBias: 0, _maxVol: 0, _cvd: cvd };
}
function addLevel(c, price, qty, isBuyerMaker) {
  const lvl = bucketOf(price);
  let row = null;
  for (const r of c.levels) if (r[0] === lvl) { row = r; break; }
  if (!row) { row = [lvl, 0, 0]; c.levels.push(row); c.levels.sort((a, b) => a[0] - b[0]); }
  if (isBuyerMaker) { row[2] += qty; c._delta -= qty; cvd -= qty; }
  else { row[1] += qty; c._delta += qty; cvd += qty; }
  c._vol += qty;
  const t = row[1] + row[2];
  if (t > c._maxVol) c._maxVol = t;
  setPOC(c);
  c._cvd = cvd;
}
function pushUpdates(c) {
  candles.update({ time: c.time, open: c.open, high: c.high, low: c.low, close: c.close });
  vol.update({ time: c.time, value: +c._vol.toFixed(4),
    color: c.close >= c.open ? "rgba(38,166,154,0.5)" : "rgba(239,83,80,0.5)" });
  dlt.update({ time: c.time, value: +c._delta.toFixed(4),
    color: c._delta >= 0 ? "rgba(38,166,154,0.65)" : "rgba(239,83,80,0.65)" });
  cvdS.update({ time: c.time, value: +cvd.toFixed(3) });
  updateStats();
}
function updateStats() {
  const c = DATA[DATA.length - 1];
  if (!c) return;
  document.getElementById("stBar").innerHTML =
    `Bar Δ <b class="${c._delta >= 0 ? "pos" : "neg"}">${c._delta >= 0 ? "+" : ""}${fmtVol(c._delta)}</b>`;
  document.getElementById("stCvd").innerHTML =
    `CVD <b style="color:${C_CVD}">${cvd >= 0 ? "+" : ""}${fmtVol(cvd)}</b>`;
  const pr = calcPrediction();
  const pel = document.getElementById("pred");
  if (pel) {
    if (pr) {
      const c0 = DATA[DATA.length - 1];
      const mat = c0 ? Math.round(Math.max(0, Math.min(1, (Date.now() - c0.time * 1000) / INT_MS)) * 100) : 0;
      let extra = ` <span style="opacity:.65">M${mat}%</span>`;
      const h = predTrack.hist;
      if (h.length) {
        const acc = h.filter(x => x.correct).length + "/" + h.length;
        extra += ` <span style="opacity:.65">Acc ${acc}</span>`;
      }
      // Live = prediksi utk candle yg lagi jalan (udah dikunci); Next = prediksi utk candle berikutnya (live update)
      // tampilkan SELALU sisi yang dominan (score besar)
      let liveP = "";
      if (predTrack.prev) {
        const lu = predTrack.prev.up, lUp = lu > 50;
        liveP = ` <span style="opacity:.65">Live</span> <b class="${lUp ? "pos" : "neg"}">${lUp ? "▲" + lu : "▼" + (100 - lu)}%</b> →`;
      }
      const nUp = pr.up > 50;
      pel.innerHTML = `${liveP} <span style="opacity:.65">Next</span> <b class="${nUp ? "pos" : "neg"}">${nUp ? "▲" + pr.up : "▼" + pr.down}%</b> <span style="opacity:.65">(${nUp ? "▼" + pr.down : "▲" + pr.up}%)</span>${extra}`;
    } else pel.textContent = "";
  }
  setLegend(c);
}

/* ---- prediksi next candle: 5 faktor orderflow -> % up/down ---- */
function calcPredictionAt(idx) {
  if (idx < 3 || idx >= DATA.length) return null;
  const cur = DATA[idx], prev = DATA.slice(idx - 3, idx);
  // 1. kekuatan delta candle live (0.30)
  const dNorm = cur._vol > 0 ? cur._delta / cur._vol : 0;
  const s1 = Math.max(-1, Math.min(1, dNorm * 3));
  // 2. momentum delta vs 3 candle lalu (0.20)
  const dTrend = (cur._delta - prev[0]._delta) / (cur._vol || 1);
  const s2 = Math.max(-1, Math.min(1, dTrend * 2));
  // 3. posisi close dalam range (0.15)
  const rng = cur.high - cur.low;
  const pos = rng > 0 ? (cur.close - cur.low) / rng : 0.5;
  const s3 = (pos - 0.5) * 2;
  // 4. exhaustion: high/low baru tapi delta lemah (0.20)
  const prevHigh = Math.max(...prev.map(c => c.high));
  const prevLow = Math.min(...prev.map(c => c.low));
  const avgD = prev.reduce((s, c) => s + Math.abs(c._delta), 0) / 3 || 1;
  let s4 = 0;
  if (cur.high > prevHigh && cur._delta < avgD * 0.5) s4 = -0.8;
  else if (cur.low < prevLow && cur._delta > -avgD * 0.5) s4 = 0.8;
  // 5. absorpsi: volume gede tapi range kecil, delta yang mutusin (0.15)
  const avgV = prev.reduce((s, c) => s + c._vol, 0) / 3 || 1;
  const avgR = prev.reduce((s, c) => s + (c.high - c.low), 0) / 3 || 1;
  let s5 = 0;
  if (cur._vol > avgV * 1.8 && rng < avgR * 0.7 && cur._delta !== 0)
    s5 = Math.sign(cur._delta) * 0.6;
  // 6. posisi POC dalam range (0.10): POC di atas = buyer aktif di harga tinggi
  const pocPos = (cur._poc != null && rng > 0) ? (cur._poc - cur.low) / rng : 0.5;
  const s6 = (pocPos - 0.5) * 2;
  // 7. CVD slope 4 candle (0.12): total tekanan kumulatif, lebih smooth dari delta
  const cvdSlope = (cur._cvd - prev[0]._cvd) / ((cur._vol + prev.reduce((s, c) => s + c._vol, 0)) || 1);
  const s7 = Math.max(-1, Math.min(1, cvdSlope * 3));
  // 8. close vs POC wall (0.12): POC punya arah (bias), close ngetes jebol/nggaknya
  // 8. close vs POC wall (KONDISIONAL): cuma dipakai kalau sinyalnya JELAS.
  //   Jelas = bias kuat (|bias|>0.3) DAN close nggak nempel di garis POC.
  //   Kalau jelas -> dominan. Kalau nggak -> diabaikan (0), pakai 7 faktor lain.
  let s8 = 0, s8clear = false;
  if (cur._poc != null && rng > 0) {
    const bias = cur._pocBias || 0;
    const distRng = Math.abs(cur.close - cur._poc) / rng;
    const above = cur.close >= cur._poc;
    if (Math.abs(bias) > 0.3 && distRng > 0.1) {
      s8clear = true;
      if (bias > 0) s8 = above ? 1.0 : -0.8;      // tembok bullish
      else s8 = above ? 0.8 : -1.0;               // tembok bearish
    }
  }
  let score;
  if (s8clear) {
    // sinyal tembok jelas -> 55% tembok + 45% faktor lain
    const rest = s1 * 0.18 + s2 * 0.12 + s3 * 0.18 + s4 * 0.22 + s5 * 0.15 + s6 * 0.0 + s7 * 0.15;
    score = s8 * 0.55 + rest * 0.45;
  } else {
    // nggak jelas -> 7 faktor tanpa POC (s6/s8 diabaikan), renormalize
    score = (s1 * 0.15 + s2 * 0.10 + s3 * 0.16 + s4 * 0.22 + s5 * 0.14 + s7 * 0.13) / 0.90;
  }
  const up = Math.max(5, Math.min(95, Math.round(50 + score * 40)));
  return { up, down: 100 - up };
}
function calcPrediction() { return calcPredictionAt(DATA.length - 1); }
// marker prediksi digambar custom di primitive (badge di atas candle)
// biar nggak tabrakan sama pane volume/delta di bawah
let predBadge = new Map(); // time -> {up, txt, bg}
function updatePredMarkers() {
  try {
    predBadge = new Map();
    for (const e of predTrack.hist.slice(-20)) {
      const isUp = e.up > 50, pct = isUp ? e.up : 100 - e.up;
      predBadge.set(e.forTime, { up: e.up,
        txt: (isUp ? "▲" : "▼") + pct + "%" + (e.correct ? "✓" : "✗"),
        bg: e.correct ? "rgba(38,166,154,0.9)" : "rgba(239,83,80,0.9)" });
    }
    if (predTrack.prev) {
      const isUp = predTrack.prev.up > 50, pct = isUp ? predTrack.prev.up : 100 - predTrack.prev.up;
      predBadge.set(predTrack.prev.forTime, { up: predTrack.prev.up,
        txt: (isUp ? "▲" : "▼") + pct + "%?",
        bg: "rgba(139,147,167,0.9)" });
    }
    if (fp) { fp.refresh(); dirty = true; }
  } catch (e) {}
}

/* ---- IndexedDB: simpan permanen candle hasil backfill ---- */
let idb = null;
function idbOpen() {
  return new Promise(res => {
    try {
      const rq = indexedDB.open("orderflow-cache", 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore("candles", { keyPath: "k" });
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => res(null);
    } catch (e) { res(null); }
  });
}
async function idbGetAll(sym, tf, bucket) {
  if (!idb) return [];
  return new Promise(res => {
    try {
      const tx = idb.transaction("candles", "readonly");
      const rq = tx.objectStore("candles").getAll();
      rq.onsuccess = () => {
        const cutoff = Date.now() / 1000 - 30 * 86400; // 30 hari
        res((rq.result || []).filter(r => r.sym === sym && r.tf === tf && r.bucket === bucket && r.time >= cutoff));
      };
      rq.onerror = () => res([]);
    } catch (e) { res([]); }
  });
}
async function idbPut(recs) {
  if (!idb || !recs.length) return;
  try {
    const tx = idb.transaction("candles", "readwrite");
    const st = tx.objectStore("candles");
    for (const r of recs) st.put(r);
  } catch (e) {}
}
async function idbDelOld(sym, tf) {
  if (!idb) return;
  try {
    const tx = idb.transaction("candles", "readwrite");
    const st = tx.objectStore("candles");
    const rq = st.getAll();
    rq.onsuccess = () => {
      const cutoff = Date.now() / 1000 - 30 * 86400;
      for (const r of (rq.result || [])) {
        if (r.sym === sym && r.tf === tf && r.time < cutoff) st.delete(r.k);
      }
    };
  } catch (e) {}
}

/* ---- backfill per-level candle gap dari aggTrades (background, paralel) ---- */
let bfGen = 0;
async function backfillLevels() {
  const gen = ++bfGen;
  const mySym = SYM, myTf = TF, myIntMs = INT_MS;
  if (!DATA.length) return;
  const lastT = DATA[DATA.length - 1].time;
  const gaps = DATA.filter(c => c.levels.length === 0 && c.time < lastT);
  // candle live juga di-backfill parsial (dari awal candle s/d 5 detik lalu)
  // biar bagian bawah yang kejadian sebelum WS connect ada footprint-nya
  const liveC = DATA[DATA.length - 1];
  if (liveC && liveC.time === lastT) {
    liveC._isLive = true;
    // cutoff: sebelum WS connect (biar nggak double-count sama trade WS)
    liveC._cutoff = (wsConnectTime ? wsConnectTime : Date.now()) - 2000;
    gaps.push(liveC);
  }
  if (!gaps.length) return;
  gaps.sort((a, b) => b.time - a.time); // terbaru dulu
  const totalGaps = gaps.length;
  let doneCount = 0;

  async function backfillOne(c) {
    const startMs = c.time * 1000;
    const isLive = !!c._isLive;
    const endMs = isLive ? Math.min(startMs + myIntMs, c._cutoff || Date.now()) : startMs + myIntMs;
    let fromId = null, first = true;
    while (true) {
      if (gen !== bfGen) return;
      let batch;
      try {
        const q = `/api/v3/aggTrades?symbol=${mySym.toUpperCase()}&limit=1000` +
                  (fromId ? `&fromId=${fromId}` : `&startTime=${startMs}&endTime=${endMs}`);
        batch = await rest(q);
      } catch (e) { break; }
      if (!batch || !batch.length) break;
      if (first) {
        first = false;
        // candle live: JANGAN reset (WS udah isi sebagian), cuma tambah
        if (!isLive) { cvd -= c._delta; c._delta = 0; c._deltaOnly = false; c._vol = 0; }
      }
      let hitEnd = false;
      for (const t of batch) {
        if (t.T < startMs) continue;
        if (t.T >= endMs) { hitEnd = true; break; }
        addLevel(c, parseFloat(t.p), parseFloat(t.q), t.m);
      }
      if (hitEnd || batch.length < 1000) break;
      fromId = batch[batch.length - 1].a + 1;
    }
  }

  // 3 worker paralel, tiap worker ambil 1 candle
  async function worker() {
    while (gaps.length) {
      if (gen !== bfGen) return;
      const c = gaps.pop();
      await backfillOne(c);
      if (gen !== bfGen) return;
      if (c.levels.length && !c._isLive) c._bf = true;
      doneCount++;
      try { fp.refresh(); dirty = true; } catch (e) {}
      setLoad(`Menyiapkan detail footprint… ${doneCount}/${totalGaps}`);
    }
  }
  await Promise.all([worker(), worker(), worker()]);
  if (gen !== bfGen) return;
  // simpan permanen ke cache lokal
  try {
    const recs = [];
    for (const c of DATA) {
      if (c._bf && c.levels.length) {
        recs.push({ k: `${mySym}:${myTf}:${BUCKET}:${c.time}`, sym: mySym, tf: myTf, bucket: BUCKET, time: c.time, levels: c.levels });
      }
    }
    await idbPut(recs);
  } catch (e) {}
  // CVD final + refresh semua series
  cvd = 0;
  for (const c of DATA) { cvd += c._delta; c._cvd = cvd; }
  vol.setData(DATA.map(c => ({ time: c.time, value: +c._vol.toFixed(4),
    color: c.close >= c.open ? "rgba(38,166,154,0.5)" : "rgba(239,83,80,0.5)" })));
  dlt.setData(DATA.map(c => ({ time: c.time, value: +c._delta.toFixed(4),
    color: c._delta >= 0 ? "rgba(38,166,154,0.65)" : "rgba(239,83,80,0.65)" })));
  cvdS.setData(DATA.map(c => ({ time: c.time, value: +c._cvd.toFixed(3) })));
  fp.refresh(); dirty = true;
  updateStats();
  setConn("● LIVE", "live");
}

/* ---- live trade handler ---- */
let predTrack = { prev: null, hist: [] }; // prev:{up,forTime}, hist:[{up,correct}]
function onTrade(t) {
  const T = t.T, p = parseFloat(t.p), q = parseFloat(t.q), m = t.m;
  if (!T || !p || !q) return;
  const ct = Math.floor(T / INT_MS) * (INT_MS / 1000);
  let c = DATA[DATA.length - 1];
  if (!c || ct > c.time) {
    // candle baru: kunci prediksi final candle yang tutup, evaluasi prediksi sblmnya
    const closed = DATA[DATA.length - 1];
    if (closed) {
      const finalPr = calcPrediction(); // saat closed masih live -> prediksi candle baru
      if (predTrack.prev && predTrack.prev.forTime === closed.time) {
        const wentUp = closed.close > closed.open;
        predTrack.hist.push({ up: predTrack.prev.up, forTime: closed.time, correct: (predTrack.prev.up > 50) === wentUp });
        if (predTrack.hist.length > 50) predTrack.hist.shift();
      }
      if (finalPr) predTrack.prev = { up: finalPr.up, forTime: ct };
      updatePredMarkers(); // rebuild badge map (hist + prev baru)
    }
    c = newCandle(ct, p);
    DATA.push(c); barByTime.set(ct, c);
  } else {
    if (p > c.high) c.high = p;
    if (p < c.low) c.low = p;
    c.close = p;
  }
  addLevel(c, p, q, m);
  pushUpdates(c);
  dirty = true;
}
setInterval(() => { if (dirty && fp) { dirty = false; fp.refresh(); } }, 300);

let wsUrlIdx = 0, wsGen = 0;
function connectWS() {
  const gen = ++wsGen;
  if (ws) { try { ws.close(); } catch (e) {} ws = null; }
  const url = `${WSS[wsUrlIdx % WSS.length]}/ws/${SYM}@trade`;
  setConn("CONNECTING…", "warn");
  let opened = false;
  let wsObj = null;
  try {
    wsObj = new WebSocket(url);
  } catch (e) {
    setConn("WS FAIL: " + shortErr(e) + " — tap untuk retry", "warn");
    return;
  }
  ws = wsObj;
  const openTimer = setTimeout(() => {
    if (!opened) { try { wsObj.close(); } catch (e) {} }
  }, 12000);
  ws.onopen = () => { opened = true; clearTimeout(openTimer); wsRetry = 0; wsConnectTime = Date.now(); setConn("● LIVE", "live"); updateVerLabel(); };
  ws.onmessage = ev => { try { onTrade(JSON.parse(ev.data)); } catch (e) {} };
  ws.onclose = () => {
    clearTimeout(openTimer);
    if (gen !== wsGen) return; // boot baru sudah jalan, jangan retry
    if (!opened) wsUrlIdx++; // gagal connect → coba endpoint lain
    setConn(opened ? "RECONNECTING…" : "WS FAIL — tap untuk retry", "warn");
    wsRetry++;
    setTimeout(() => { if (gen === wsGen) connectWS(); }, Math.min(30000, 2000 * wsRetry));
  };
  ws.onerror = () => { try { ws.close(); } catch (e) {} };
}

document.getElementById("conn").title = "tap untuk retry koneksi";
document.getElementById("conn").onclick = () => { wsRetry = 0; boot(SYM, TF); };

if (verEl) verEl.textContent = VER;

async function boot(sym, tf) {
  SYM = sym; if (tf) TF = tf;
  INT_MS = TFS[TF]; BUCKET = BUCKETS[SYM][TF];
  document.getElementById("symLabel").textContent = SYMS[sym].label;
  document.getElementById("tfLabel").textContent = TF + " FOOTPRINT · LIVE";
  document.getElementById("bBTC").classList.toggle("on", sym === "btcusdt");
  document.getElementById("bETH").classList.toggle("on", sym === "ethusdt");
  document.querySelectorAll(".tfbtn").forEach(b => b.classList.toggle("on", b.dataset.tf === TF));
  if (ws) { try { ws.close(); } catch (e) {} ws = null; }
  bfGen++; // batalkan backfill lama
  predTrack = { prev: null, hist: [] }; // reset tracking prediksi
  setLoad(`Menyiapkan ${sym.toUpperCase()} ${TF}…`);
  setConn("LOADING…", "warn");
  DATA = []; barByTime.clear(); cvd = 0;

  // 1) history footprint dari tick asli (ada imbalance-nya), kalau tersedia utk TF ini
  //     4h disintesis dari 1h (gabung 4 candle)
  let HIST = (typeof HISTORY !== "undefined" && HISTORY[SYM] && HISTORY[SYM][TF]) || null;
  if (!HIST && TF === "4h" && typeof HISTORY !== "undefined" && HISTORY[SYM] && HISTORY[SYM]["1h"]) {
    const h1 = HISTORY[SYM]["1h"], out = [];
    for (let i = 0; i + 3 < h1.length; i += 4) {
      const grp = [h1[i], h1[i+1], h1[i+2], h1[i+3]];
      const lvMap = new Map();
      for (const g of grp) for (const lv of g.levels) {
        const r = lvMap.get(lv[0]) || [lv[0], 0, 0];
        r[1] += lv[1]; r[2] += lv[2]; lvMap.set(lv[0], r);
      }
      out.push({ time: grp[0].time, open: grp[0].open,
        high: Math.max(...grp.map(g => g.high)), low: Math.min(...grp.map(g => g.low)),
        close: grp[3].close, levels: [...lvMap.values()].sort((a, b) => a[0] - b[0]) });
    }
    HIST = out;
  }
  if (HIST && HIST.length) {
    for (const h of HIST) {
      const c = { time: h.time, open: h.open, high: h.high, low: h.low, close: h.close,
                  levels: h.levels.map(r => [r[0], r[1], r[2]]),
                  _delta: 0, _vol: 0, _poc: null, _pocBias: 0, _maxVol: 0, _cvd: 0 };
      let d = 0, tv = 0, mx = 0;
      for (const lv of c.levels) {
        const t = lv[1] + lv[2];
        d += lv[1] - lv[2]; tv += t;
        if (t > mx) mx = t;
      }
      c._delta = d; c._vol = tv; c._maxVol = mx; setPOC(c);
      cvd += d; c._cvd = cvd;
      DATA.push(c); barByTime.set(c.time, c);
    }
  }

  // 2) klines mengisi gap dari history terakhir -> sekarang
  setLoad("Mengambil data klines…");
  let kl = null, klErr = null;
  try {
    const startMs = DATA.length ? DATA[DATA.length - 1].time * 1000 : 0;
    const q = `/api/v3/klines?symbol=${sym.toUpperCase()}&interval=${TF}&limit=200` +
              (startMs ? `&startTime=${startMs}` : "");
    kl = await rest(q);
    if (!kl || !kl.length) throw new Error("empty klines");
  } catch (e) { klErr = e; }
  if (kl) {
    for (const k of kl) {
      const t = k[0] / 1000;
      if (barByTime.has(t)) continue; // sudah ada dari history
      const c = { time: t, open: +k[1], high: +k[2], low: +k[3], close: +k[4],
                  levels: [], _delta: 0, _vol: +k[5], _poc: null, _pocBias: 0, _maxVol: 0, _cvd: cvd };
      DATA.push(c); barByTime.set(c.time, c);
    }
  }
  if (!DATA.length) {
    setConn("DATA FAIL: " + shortErr(klErr) + " — tap untuk retry", "warn");
    setLoad("Gagal memuat data — tap status untuk retry");
    return;
  }
  const histOnly = !kl;
  if (histOnly) setConn("HISTORY SAJA (live gagal) — tap untuk retry", "warn");

  // 2a) bucket otomatis dari volatilitas; re-bin history kalau perlu
  const autoB = autoBucket();
  if (autoB > BUCKETS[SYM][TF]) {
    for (const c of DATA) {
      if (c.levels.length && !c._bf) {
        c.levels = rebinLevels(c.levels, autoB);
        finalizeCandle(c);
      }
    }
  }
  BUCKET = autoB;

  // 2b) delta candle gap (tanpa footprint) dari klines 1m:
  //     taker buy vol = agresif buy -> delta akurat, walau tanpa per-level
  try {
    const gaps = DATA.filter(c => c.levels.length === 0);
    if (gaps.length) {
      const perParent = new Map();
      let cur = gaps[0].time * 1000;
      const endMs = Date.now();
      for (let pg = 0; pg < 4 && cur < endMs; pg++) {
        const m1 = await rest(`/api/v3/klines?symbol=${sym.toUpperCase()}&interval=1m&limit=1000&startTime=${cur}`);
        if (!m1 || !m1.length) break;
        for (const k of m1) {
          const pt = Math.floor(k[0] / INT_MS) * (INT_MS / 1000);
          const buy = +k[9], tot = +k[5];
          perParent.set(pt, (perParent.get(pt) || 0) + (2 * buy - tot));
        }
        const lastT = m1[m1.length - 1][0];
        if (m1.length < 1000 || lastT >= endMs - 60000) break;
        cur = lastT + 60000;
      }
      for (const c of gaps) {
        if (perParent.has(c.time)) {
          c._delta = perParent.get(c.time);
          c._deltaOnly = true;
        }
      }
    }
  } catch (e) { /* delta gap opsional, skip kalau gagal */ }

  // 2c) restore candle backfill dari cache lokal (biar nggak download ulang)
  try {
    idb = await idbOpen();
    const cached = await idbGetAll(SYM, TF, BUCKET);
    if (cached.length) {
      const cm = new Map(cached.map(r => [r.time, r.levels]));
      for (const c of DATA) {
        const lv = cm.get(c.time);
        if (c.levels.length === 0 && lv && lv.length) {
          c.levels = lv;
          let d = 0, tv = 0, mx = 0;
          for (const r of lv) {
            const t = r[1] + r[2];
            d += r[1] - r[2]; tv += t;
            if (t > mx) mx = t;
          }
          c._delta = d; c._vol = tv; c._maxVol = mx; setPOC(c);
          c._deltaOnly = false; c._bf = true;
        }
      }
      idbDelOld(SYM, TF);
    }
  } catch (e) {}

  // CVD final: satu pass urut waktu
  cvd = 0;
  for (const c of DATA) { cvd += c._delta; c._cvd = cvd; }
  try {
    const ohlc = DATA.map(c => ({ time: c.time, open: c.open, high: c.high, low: c.low, close: c.close }));
    // validasi: jangan sampai ada NaN/undefined yang merusak price scale
    for (const o of ohlc) {
      if (![o.time, o.open, o.high, o.low, o.close].every(v => typeof v === "number" && isFinite(v))) {
        throw new Error("invalid OHLC data");
      }
    }
    candles.setData(ohlc);
  } catch (e) {
    setConn("DATA ERR: " + shortErr(e), "warn");
    setLoad("Data rusak: " + shortErr(e));
    return;
  }
  // paksa price scale auto-fit (kalau user pernah drag manual, autoScale bisa mati)
  try { c1.priceScale("right").applyOptions({ autoScale: true }); } catch (e) {}
  vol.setData(DATA.map(c => ({ time: c.time, value: +c._vol.toFixed(4),
    color: c.close >= c.open ? "rgba(38,166,154,0.5)" : "rgba(239,83,80,0.5)" })));
  dlt.setData(DATA.map(c => ({ time: c.time, value: +c._delta.toFixed(4),
    color: c._delta >= 0 ? "rgba(38,166,154,0.65)" : "rgba(239,83,80,0.65)" })));
  cvdS.setData(DATA.map(c => ({ time: c.time, value: +c._cvd.toFixed(3) })));
  const n0 = DATA.length;
  applyDefaultZoom();
  updateVerLabel();

  // backfill footprint candle berjalan dari aggTrades terakhir
  try {
    const cur = DATA[DATA.length - 1];
    const agg = await rest(`/api/v3/aggTrades?symbol=${sym.toUpperCase()}&limit=1000`);
    for (const t of agg) {
      if (t.T >= cur.time * 1000) addLevel(cur, parseFloat(t.p), parseFloat(t.q), t.m);
    }
    pushUpdates(cur); dirty = true;
  } catch (e) {}

  updateStats();
  // 3) backfill detail per-level — TUNGGU selesai baru tampil chart
  setLoad("Menyiapkan detail footprint…");
  try { await backfillLevels(); } catch (e) {}
  // backfill prediksi historis: hitung prediksi tiap candle masa lalu, langsung ada prev+akurasi
  try {
    predTrack.hist = [];
    for (let i = 3; i < DATA.length - 1; i++) {
      const pr = calcPredictionAt(i);
      if (!pr) continue;
      const nxt = DATA[i + 1];
      // candle terakhir (live) belum tutup -> jangan evaluasi, tapi jadi prev
      if (i === DATA.length - 2) {
        predTrack.prev = { up: pr.up, forTime: nxt.time };
        break;
      }
      const wentUp = nxt.close > nxt.open;
      predTrack.hist.push({ up: pr.up, forTime: nxt.time, correct: (pr.up > 50) === wentUp });
    }
    if (predTrack.hist.length > 50) predTrack.hist = predTrack.hist.slice(-50);
    updatePredMarkers();
  } catch (e) {}
  // 4) connect WS, tunggu live (max 5 detik) baru buka tirai
  setLoad("Menghubungkan live…");
  connectWS();
  await new Promise(res => {
    const t0 = Date.now();
    const iv = setInterval(() => {
      if (wsConnectTime || Date.now() - t0 > 5000) { clearInterval(iv); res(); }
    }, 200);
  });
  hideLoad();
}

  updateVerLabel();
}

/* ---- footprint overlay (sama seperti versi statis) ---- */
class FootprintPrimitive {
  constructor() { this._chart = null; this._series = null; this._req = null; }
  attached(p) { this._chart = p.chart; this._series = p.series; this._req = p.requestUpdate; }
  detached() { this._chart = null; this._series = null; this._req = null; }
  refresh() { if (this._req) this._req(); }
  paneViews() { return [new FootprintPaneView(this)]; }
}
class FootprintPaneView {
  constructor(p) { this._p = p; }
  renderer() { return new FootprintRenderer(this._p); }
  zOrder() { return "normal"; }
}
class FootprintRenderer {
  constructor(p) { this._p = p; }
  draw(target) {
    const p = this._p;
    if (!p._chart || !p._series) return;
    const ts = p._chart.timeScale(), series = p._series;
    const vis = [];
    for (const c of DATA) {
      const x = ts.timeToCoordinate(c.time);
      if (x !== null) vis.push({ c, x });
    }
    if (!vis.length) return;
    target.useBitmapCoordinateSpace(scope => {
      const ctx = scope.context;
      const hr = scope.horizontalPixelRatio, vr = scope.verticalPixelRatio;
      const mediaW = scope.bitmapSize.width / hr;
      const widths = vis.map((v, i) => {
        const nx = vis[i + 1], pv = vis[i - 1];
        const gap = nx ? nx.x - v.x : (pv ? v.x - pv.x : 8);
        return Math.max(4, Math.min(170, gap));
      });
      vis.forEach((v, i) => {
        const { c, x } = v;
        if (x < -150 || x > mediaW + 150) return;
        const slotW = widths[i], xb = x * hr;

        // hollow candle — selalu digambar walau tanpa data footprint
        const oY = series.priceToCoordinate(c.open);
        const cY = series.priceToCoordinate(c.close);
        const hY = series.priceToCoordinate(c.high);
        const lY = series.priceToCoordinate(c.low);
        if (oY !== null && cY !== null && hY !== null && lY !== null) {
          const up = c.close >= c.open;
          const col = up ? C_BUY : C_SELL;
          const halfW = Math.max(2 * hr, slotW * hr * 0.30);
          ctx.strokeStyle = col;
          ctx.lineWidth = Math.max(1, 1.4 * vr);
          ctx.beginPath(); ctx.moveTo(xb, hY * vr); ctx.lineTo(xb, lY * vr); ctx.stroke();
          const bTop = Math.min(oY, cY) * vr;
          const bH = Math.max(2 * vr, Math.abs(cY - oY) * vr);
          ctx.strokeRect(xb - halfW / 2, bTop, halfW, bH);
          // badge prediksi di atas candle (custom, biar nggak tabrakan pane bawah)
          const pe = predBadge.get(c.time);
          if (pe && slotW >= 30) {
            const txt = pe.txt;
            ctx.font = `700 ${10 * vr}px -apple-system, sans-serif`;
            const tw = ctx.measureText(txt).width;
            // taruh di kiri atas slot (bukan tengah) biar nggak numpuk teks level
            const bx = xb - slotW * hr / 2 + 3 * vr, by = hY * vr - 24 * vr;
            const bh = 16 * vr, bw = tw + 8 * vr;
            ctx.fillStyle = pe.bg;
            if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 8 * vr); ctx.fill(); }
            else ctx.fillRect(bx, by, bw, bh);
            ctx.fillStyle = "#fff";
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText(txt, bx + bw / 2, by + bh / 2 + 1);
          }
        }

        if (!c._maxVol && !c._deltaOnly) return; // tanpa data: cell & pill di-skip
        const textMode = slotW >= 62;

        for (const lv of c.levels) {
          const price = lv[0], buy = lv[1], sell = lv[2];
          const yT = series.priceToCoordinate(price + BUCKET / 2);
          const yB = series.priceToCoordinate(price - BUCKET / 2);
          if (yT === null || yB === null) continue;
          const y = yT * vr, h = Math.max(1, (yB - yT) * vr);

          if (textMode && h >= 11 * vr) {
            const half = slotW * hr / 2;
            const bImb = sell > 0 && buy / sell >= IMB;
            const sImb = buy > 0 && sell / buy >= IMB;
            const tot = buy + sell;
            const v = c._maxVol > 0 ? tot / c._maxVol : 0;
            const strong = bImb || sImb;
            const yc = y + h / 2;
            const bT = fmtVol(buy), sT = fmtVol(sell);
            const fs = Math.min(11 * vr, h * 0.48);
            ctx.font = `600 ${fs}px -apple-system, "Segoe UI", sans-serif`;
            ctx.textBaseline = "middle";

            // background SELALU directional: ijo = buy menang, merah = sell menang
            // imbalance ≥3× dapat alpha lebih kuat biar nabrak mata
            // intensitas MURNI dari total volume (buy+sell), bukan dari selisih.
            // 4000x6000 (total 10000) > 1x200 (total 201), walau 1x200 imbalance-nya gede.
            // imbalance >=3x tetap ditandai via "x" dan angka, tapi nggak boost background.
            const alpha = 0.08 + 0.52 * v;
            if (buy > sell) ctx.fillStyle = `rgba(38,166,154,${alpha.toFixed(3)})`;
            else if (sell > buy) ctx.fillStyle = `rgba(239,83,80,${alpha.toFixed(3)})`;
            else ctx.fillStyle = "rgba(130,140,160,0.06)";
            ctx.fillRect(xb - half, y, half * 2, h);

            if (strong) {
              ctx.textAlign = "right";
              ctx.fillStyle = "#4ec9b0";
              ctx.fillText(bT, xb - 4 * vr, yc);
              ctx.textAlign = "center"; ctx.fillStyle = "#e8ecf1";
              ctx.fillText("×", xb, yc);
              ctx.textAlign = "left";
              ctx.fillStyle = "#f48771";
              ctx.fillText(sT, xb + 4 * vr, yc);
            } else {
              ctx.textAlign = "right";
              ctx.fillStyle = "#4ec9b0";
              ctx.fillText(bT, xb - 4 * vr, yc);
              ctx.textAlign = "center"; ctx.fillStyle = "#6a6f80";
              ctx.fillText("×", xb, yc);
              ctx.textAlign = "left";
              ctx.fillStyle = "#f48771";
              ctx.fillText(sT, xb + 4 * vr, yc);
            }
          } else {
            const tot = buy + sell, net = buy - sell;
            const w = c._maxVol > 0 ? (tot / c._maxVol) * (slotW * 0.32) * hr : 0;
            if (w > 0.5) {
              ctx.fillStyle = net > 0 ? "rgba(38,166,154,0.78)" : net < 0 ? "rgba(239,83,80,0.78)" : "rgba(130,140,160,0.5)";
              ctx.fillRect(xb - w / 2, y, w, h);
            }
          }
        }

        // garis POC (VWAP / center of gravity) — horizontal melintasi candle
        if (c._poc != null && slotW >= 20) {
          const pocY = series.priceToCoordinate(c._poc);
          if (pocY !== null) {
            ctx.strokeStyle = C_POC;
            ctx.lineWidth = Math.max(1.5 * vr, 2);
            ctx.setLineDash([5 * vr, 4 * vr]);
            ctx.beginPath();
            ctx.moveTo(xb - slotW * hr / 2, pocY * vr);
            ctx.lineTo(xb + slotW * hr / 2, pocY * vr);
            ctx.stroke();
            ctx.setLineDash([]);
          }
        }

        const yLow = series.priceToCoordinate(c.low);
        if (yLow !== null && slotW >= 30 && (c._maxVol || c._deltaOnly)) {
          const d = c._delta;
          const txt = (d >= 0 ? "+" : "") + fmtVol(d);
          const fs = Math.min(9 * vr, slotW * 0.26 * vr);
          if (fs >= 6 * vr) {
            ctx.font = `700 ${fs}px -apple-system, sans-serif`;
            const w = ctx.measureText(txt).width;
            const bw2 = Math.min(w + 8 * vr, slotW * hr * 0.88);
            const px = xb - bw2 / 2, py = yLow * vr + 18 * vr, ph = fs + 6 * vr;
            ctx.fillStyle = d >= 0 ? "rgba(38,166,154,0.92)" : "rgba(239,83,80,0.92)";
            roundRect(ctx, px, py, bw2, ph, 4 * vr); ctx.fill();
            ctx.fillStyle = "#0b0e14"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText(txt, xb, py + ph / 2 + vr);
          }
        }
      });
    });
  }
}

function syncVisible(source, targets) {
  source.timeScale().subscribeVisibleLogicalRangeChange(range => {
    if (!range || syncing) return;
    syncing = true;
    try {
      targets.forEach(t => t.timeScale().setVisibleLogicalRange(range));
    } finally {
      syncing = false;
    }
    updateVerLabel();
  });
}

/* ============================================================
   POLYMARKET ORDERBOOK PANEL (PROTOTYPE)
   ------------------------------------------------------------
   DEPLOYMENT NOTE: Ini pakai CORS proxy publik (corsproxy.io).
   Untuk production, GANTI dengan backend sendiri:
   - Bikin endpoint server-side yang fetch ke gamma-api + clob.polymarket.com
   - Frontend cukup fetch ke backend sendiri (tanpa CORS proxy)
   - Alasan: CORS proxy pihak ketiga tidak reliable & bisa mati kapan saja
   ============================================================ */
const PM_PROXY = "https://corsproxy.io/?url=";
let pmTimer = null, pmCurSlug = null;

function pmEligible() {
  return (TF === "5m" || TF === "15m") && (SYM === "btcusdt" || SYM === "ethusdt");
}
function pmUpdateBtn() {
  document.getElementById("pmBtn").classList.toggle("show", pmEligible());
  if (!pmEligible()) pmClosePanel();
}
function pmWindowStart() {
  const sec = TF === "5m" ? 300 : 900;
  return Math.floor(Date.now() / 1000 / sec) * sec;
}
function pmSlug() {
  const coin = SYM === "btcusdt" ? "btc" : "eth";
  return `${coin}-updown-${TF}-${pmWindowStart()}`;
}
async function pmFetch(url) {
  const r = await fetch(PM_PROXY + encodeURIComponent(url));
  if (!r.ok) throw new Error("proxy " + r.status);
  return r.json();
}
async function pmLoad() {
  const meta = document.getElementById("pmMeta"), body = document.getElementById("pmBody");
  const slug = pmSlug();
  try {
    meta.textContent = "Loading " + slug + "…";
    // 1) cari market aktif
    const ev = await pmFetch("https://gamma-api.polymarket.com/events/slug/" + slug);
    const mk = (ev.markets || [])[0];
    if (!mk) { meta.textContent = "Market tidak ditemukan."; return; }
    const tids = JSON.parse(mk.clobTokenIds || "[]");
    const outs = JSON.parse(mk.outcomes || '["Yes","No"]');
    pmCurSlug = slug;
    meta.textContent = mk.question || slug;
    // 2) ambil orderbook Yes & No
    let html = "";
    for (let i = 0; i < Math.min(2, tids.length); i++) {
      const bk = await pmFetch("https://clob.polymarket.com/book?token_id=" + tids[i]);
      const nm = outs[i] || (i === 0 ? "Yes" : "No");
      const col = nm.toLowerCase() === "yes" ? "#26a69a" : "#ef5350";
      html += `<div class="pm-side"><h4 style="color:${col}">${nm}</h4>`;
      const asks = (bk.asks || []).slice(-5).reverse(); // ask terendah di atas
      const bids = (bk.bids || []).slice(0, 5);
      asks.forEach(a => { html += `<div class="pm-row pm-ask"><span>${a.price}</span><span>${(+a.size).toFixed(1)}</span></div>`; });
      html += `<div class="pm-row" style="border-top:1px solid #1e2530;border-bottom:1px solid #1e2530"><span>—</span><span>—</span></div>`;
      bids.forEach(b => { html += `<div class="pm-row pm-bid"><span>${b.price}</span><span>${(+b.size).toFixed(1)}</span></div>`; });
      html += `</div>`;
    }
    body.innerHTML = html;
  } catch (e) {
    meta.textContent = "Gagal load: " + e.message;
  }
}
function pmOpenPanel() {
  document.getElementById("pmPanel").classList.add("open");
  pmLoad();
  if (pmTimer) clearInterval(pmTimer);
  pmTimer = setInterval(() => {
    // ganti market otomatis kalau window sudah berganti
    if (pmSlug() !== pmCurSlug) pmLoad(); else pmLoad();
  }, 15000);
}
function pmClosePanel() {
  document.getElementById("pmPanel").classList.remove("open");
  if (pmTimer) { clearInterval(pmTimer); pmTimer = null; }
}
document.getElementById("pmBtn").onclick = () => {
  document.getElementById("pmPanel").classList.contains("open") ? pmClosePanel() : pmOpenPanel();
};
document.getElementById("pmClose").onclick = pmClosePanel;
// hook ke boot: update visibilitas tombol PM setiap ganti symbol/TF
const _bootOrig = boot;
boot = async function(sym, tf) { const r = await _bootOrig(sym, tf); pmUpdateBtn(); return r; };

boot("btcusdt", "1h");
