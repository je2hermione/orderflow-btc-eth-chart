services:
  orderflow:
    build: .
    container_name: orderflow
    restart: unless-stopped
    # Bind to localhost only. Expose via nginx reverse proxy + Authelia.
    # Do NOT change to 0.0.0.0:8000 unless you know what you're doing —
    # the API has no built-in authentication.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - orderflow-data:/data
    environment:
      - DATA_DIR=/data
      - WEB_DIR=/app/web
      # comma-separated, lowercase. e.g. "btcusdt,ethusdt,solusdt"
      - SYMBOLS=btcusdt,ethusdt
      # delete parquet files older than N days (0 = keep forever)
      - RETENTION_DAYS=30
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # fails if recorder heartbeat is stale -> triggers restart
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,json; r=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=5)); exit(0 if r.get('recorder_alive') else 1)\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  orderflow-data:
